<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORI GVM calculator fixture</title>
    <style>
      :root {
        --brand-teal: #56bdc2;
        --brand-black: #000;
        --brand-display-font: Arial, sans-serif;
        --brand-body-font: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .container-full {
        width: 100%;
      }
    </style>
    <link rel="stylesheet" href="../../assets/ori-gvm-calculator.css">
    <script src="../../assets/ori-gvm-calculator-engine.js" defer></script>
    <script src="../../assets/ori-gvm-calculator.js" defer></script>
  </head>
  <body>
    <main>
      <section class="ori-gvm-calculator">
        <div class="container-full">
          <ori-gvm-calculator
            data-section-id="fixture"
            data-source-url="/assets/ori-gvm-calculator-data.json"
            data-warning-threshold="0.95"
            data-enable-tour="true"
            data-fallback-quote-url="/pages/contact"
            data-quote-label="View ORI GVM package"
            data-show-accessories="false"
            data-show-quote-button="false"
            aria-busy="true"
          >
            <div class="ori-gvm-calculator__intro" data-gvm-intro>
              <div class="ori-gvm-calculator__intro-content">
                <h1 class="ori-gvm-calculator__heading">ORI GVM load calculator</h1>
                <div class="ori-gvm-calculator__overview">
                  <p>Choose an ORI vehicle package and check how your load sits against the published ratings.</p>
                </div>
                <div class="ori-gvm-calculator__disclaimer">
                  <p><strong>Planning guide only.</strong> Confirm exact figures against your compliance paperwork and weighbridge results.</p>
                </div>
              </div>
            </div>

            <div class="ori-gvm-calculator__app" data-gvm-app>
              <p data-gvm-status role="status">Loading calculator data...</p>
            </div>

            <script type="application/json" data-gvm-translations>
              {
                "select_vehicle": "Select ORI vehicle package",
                "select_vehicle_placeholder": "-- Select a package --",
                "simulator_suffix": "Load check",
                "quote_cta": "View ORI GVM package",
                "tutorial_replay": "How to use this calculator",
                "upgrades_title": "Selected specification",
                "factory_option": "Use selected package rating",
                "factory_description": "Checks your load against this ORI specification",
                "trailer_title": "Trailer weight",
                "occupants_title": "Cabin and cargo load",
                "accessories_title": "Accessories",
                "front": "Front",
                "middle": "Middle",
                "rear": "Rear",
                "atm": "ATM",
                "tbm": "TBM",
                "passengers": "Passengers",
                "cargo_rear": "Cargo - rear",
                "summary_title": "Load check summary",
                "visual_title": "Limit gauges",
                "vehicle_gvm": "Vehicle GVM",
                "combined_gcm": "Combined GCM",
                "towing_capacity": "Towing capacity",
                "tbm_limit": "TBM limit",
                "atm_entered": "ATM entered",
                "tbm_entered": "TBM entered",
                "vehicle_total": "Vehicle total (GVM)",
                "combined_mass": "Combined mass (GCM)",
                "front_axle": "Front axle",
                "rear_axle": "Rear axle",
                "gvm": "GVM",
                "gcm": "GCM",
                "kg": "kg",
                "status_ok": "Within limit",
                "status_warning": "Near limit",
                "status_danger": "Over limit",
                "status_unavailable": "Limit unavailable",
                "loading": "Loading calculator data...",
                "load_error": "Calculator data could not be loaded.",
                "retry": "Try again",
                "vehicle_unavailable": "This vehicle does not have enough data to calculate safely.",
                "no_accessories": "No accessories listed",
                "tutorial_step": "Step",
                "tutorial_of": "of",
                "tutorial_close": "Close tutorial",
                "tutorial_back": "Back",
                "tutorial_skip": "Skip",
                "tutorial_next": "Next",
                "tutorial_done": "Done",
                "tutorial_dialog_label": "Calculator tutorial",
                "tour_trailer_title": "Trailer and hitch",
                "tour_trailer_text": "Enter your trailer ATM and TBM.",
                "tour_occupants_title": "Occupants and cargo",
                "tour_occupants_text": "Add realistic passenger and cargo weights.",
                "tour_accessories_title": "Accessories",
                "tour_accessories_text": "Select fitted and planned accessories.",
                "tour_summary_title": "Summary and visual results",
                "tour_summary_text": "Review every calculated limit.",
                "tour_upgrades_title": "GVM upgrades",
                "tour_upgrades_text": "Compare factory and upgrade limits."
              }
            </script>
          </ori-gvm-calculator>
        </div>
      </section>
    </main>
  </body>
</html>
