<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slideshow interaction fixture</title>
    <style>.hidden { display: none; } body { margin: 0; }</style>
    <link rel="stylesheet" href="../../assets/slideshow-component.css">
  </head>
  <body>
    <div class="f-slideshow">
    <slideshow-component
      id="hero"
      class="f-slideshow-wrapper f-slideshow-wrapper--adapt"
      data-media-loading
      data-autoplay-after-interaction="200"
    >
      <flickity-component
        class="f-slideshow__slides"
        style="--aspect-ratio: 2; --aspect-ratio-mobile: 1.25;"
      >
        <div class="f-slideshow__slide" data-index="0">
          <div class="f-slideshow__slide-bg">
            <img alt="First slide" loading="lazy" fetchpriority="low" width="1280" height="360">
          </div>
        </div>
        <div class="f-slideshow__slide" data-index="1">
          <img alt="Later slide" loading="lazy" fetchpriority="low" width="1280" height="360">
          <deferred-media>
            <template><video muted playsinline loop></video></template>
          </deferred-media>
        </div>
      </flickity-component>
      <div class="f-slideshow__text">
        <div class="f-slideshow__content-wrapper" data-text-color="#000">
          <div class="f-slideshow__content f-text-blocks hidden">
            <h2 class="f-slideshow__title">Choose your offroad vehicle</h2>
            <div class="f-slideshow__description">Engineered upgrades for touring and towing.</div>
            <div class="f-slideshow__btn-group">
              <div class="f-slideshow__btn"><a href="#packages">View GVM packages</a></div>
            </div>
          </div>
        </div>
        <div class="f-slideshow__content-wrapper" data-text-color="#000">
          <div class="f-slideshow__content f-text-blocks hidden">
            <h2 class="f-slideshow__title">Built for the next track</h2>
          </div>
        </div>
      </div>
    </slideshow-component>
    </div>
    <button id="next-slide" type="button" style="position: relative; z-index: 1;">Next slide</button>

    <script>
      window.FoxThemeSettings = { isMobile: false };
      window.queryDomNodes = function queryDomNodes(selectors, context) {
        return Object.fromEntries(
          Object.entries(selectors).map(([key, selector]) => [
            key,
            Array.isArray(selector)
              ? Array.from(context.querySelectorAll(selector[0]))
              : context.querySelector(selector),
          ]),
        );
      };

      const fixtureParams = new URLSearchParams(window.location.search);
      const fixtureAutoplay = Number(fixtureParams.get('autoplay'));
      if (fixtureParams.get('homepage') === '1') document.body.classList.add('template-index');
      if (fixtureParams.get('legacyMarkup') === '1') {
        document.body.classList.toggle('template-index', fixtureParams.get('nonHomepage') !== '1');
        const hero = document.querySelector('#hero');
        const flickity = hero.querySelector('flickity-component');
        hero.removeAttribute('data-autoplay-after-interaction');
        flickity.dataset.sliderOptions = JSON.stringify({
          autoPlay: Number.isFinite(fixtureAutoplay) && fixtureAutoplay > 0 ? fixtureAutoplay : 200,
        });
      }
      if (Number.isFinite(fixtureAutoplay) && fixtureAutoplay > 0) {
        if (fixtureParams.get('legacyMarkup') !== '1') {
          document.querySelector('#hero').dataset.autoplayAfterInteraction = fixtureAutoplay;
        }
      }
      if (fixtureParams.get('videoFirst') === '1') {
        const flickity = document.querySelector('flickity-component');
        flickity.prepend(flickity.querySelector('[data-index="1"]'));
      }
      if (fixtureParams.get('nonAdapt') === '1') {
        document.querySelector('#hero').classList.remove('f-slideshow-wrapper--adapt');
      }
      if (fixtureParams.get('mobileStack') === '1') {
        document.querySelector('#hero').classList.add('f-slideshow--mobile-stack');
      }
      if (fixtureParams.get('videoOnlyFirst') === '1') {
        const flickity = document.querySelector('flickity-component');
        const firstSlide = flickity.querySelector('[data-index="0"]');
        const laterSlide = flickity.querySelector('[data-index="1"]');
        firstSlide.querySelector('img').remove();
        firstSlide.appendChild(laterSlide.querySelector('deferred-media'));
      }
      if (fixtureParams.get('responsiveFirst') === '1') {
        const firstSlide = document.querySelector('[data-index="0"]');
        firstSlide.classList.add('f-slideshow__slide--has-mobile-image');
        const mobileWrapper = document.createElement('div');
        mobileWrapper.className = 'f-slideshow__slide-mobile';
        const mobileImage = document.createElement('img');
        mobileImage.alt = 'First slide mobile';
        mobileImage.loading = 'lazy';
        mobileImage.setAttribute('fetchpriority', 'low');
        mobileImage.width = 390;
        mobileImage.height = 520;
        mobileWrapper.appendChild(mobileImage);
        firstSlide.appendChild(mobileWrapper);
      }

      HTMLMediaElement.prototype.play = function play() {
        this.playCount = (this.playCount || 0) + 1;
        return Promise.resolve();
      };
      HTMLMediaElement.prototype.pause = function pause() {
        this.pauseCount = (this.pauseCount || 0) + 1;
      };

      class DeferredMedia extends HTMLElement {
        constructor() {
          super();
          this.loadCount = 0;
        }

        loadContent() {
          this.loadCount += 1;
          const template = this.querySelector('template');
          if (template) {
            this.appendChild(template.content.cloneNode(true));
            template.remove();
            this.setAttribute('loaded', '');
          }
        }
      }
      customElements.define('deferred-media', DeferredMedia);

      class FakeSlider {
        constructor(element) {
          this.element = element;
          const markupOptions = JSON.parse(element.dataset.sliderOptions || '{}');
          this.options = {
            autoPlay: markupOptions.autoPlay || false,
            pauseAutoPlayOnHover: true,
          };
          this.selectedIndex = 0;
          this.selectedElement = element.querySelectorAll('.f-slideshow__slide')[0];
          this.handlers = {};
          this.activateCalls = 0;
          this.deactivateCalls = 0;
          this.pauseCalls = 0;
          this.playCalls = 0;
          this.isPlayerActive = fixtureParams.get('preActivated') === '1';
          this.timer = null;
          this._onMouseEnter = this.onmouseenter.bind(this);
          this._onMouseLeave = this.onmouseleave.bind(this);
          if (fixtureParams.get('legacyPlayer') === '1') this.activatePlayer = undefined;
        }

        on(name, callback) {
          this.handlers[name] = callback;
        }

        playPlayer() {
          this.playCalls += 1;
          this.scheduleNext();
        }

        activatePlayer() {
          this.activateCalls += 1;
          if (this.isPlayerActive) return;
          if (!this.options.autoPlay) return;
          this.isPlayerActive = true;
          this.playPlayer();
          this.element.addEventListener('mouseenter', this._onMouseEnter);
        }

        deactivatePlayer() {
          this.deactivateCalls += 1;
          this.isPlayerActive = false;
          this.stopPlayer();
          this.element.removeEventListener('mouseenter', this._onMouseEnter);
          this.element.removeEventListener('mouseleave', this._onMouseLeave);
        }

        scheduleNext() {
          clearTimeout(this.timer);
          this.timer = setTimeout(() => {
            this.timer = null;
            this.next();
          }, this.options.autoPlay);
        }

        stopPlayer() {
          clearTimeout(this.timer);
          this.timer = null;
        }

        onmouseenter() {
          if (!this.options.pauseAutoPlayOnHover) return;
          this.pauseCalls += 1;
          this.stopPlayer();
          this.element.addEventListener('mouseleave', this._onMouseLeave);
        }

        onmouseleave() {
          this.scheduleNext();
          this.element.removeEventListener('mouseleave', this._onMouseLeave);
        }

        next() {
          const slides = this.element.querySelectorAll('.f-slideshow__slide');
          this.selectedIndex = (this.selectedIndex + 1) % slides.length;
          this.selectedElement = slides[this.selectedIndex];
          if (this.handlers.change) this.handlers.change(this.selectedIndex);
        }
      }

      class FakeFlickity extends HTMLElement {
        connectedCallback() {
          if (fixtureParams.get('missing') === '1') {
            this.slider = { instance: null };
            return;
          }
          this.classList.add('flickity-enabled');
          this.slider = { instance: new FakeSlider(this) };
        }
      }
      customElements.define('flickity-component', FakeFlickity);

      document.querySelector('#next-slide').addEventListener('click', () => {
        document.querySelector('flickity-component').slider.instance.next();
      });
    </script>
    <script src="../../assets/slideshow-component.js"></script>
  </body>
</html>
